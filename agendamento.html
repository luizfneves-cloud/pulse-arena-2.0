<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Arena - Agendamento</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Arena Pulse</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="servicos.html">Serviços</a>
            <a href="agendamento.html">Agendamento</a>
        </nav>
    </header>

    <main>
        <h2 class="form1">Agende sua consulta</h2>
        <form action="#" method="post" id="formulario">
            <label for="nome">Nome e Sobrenome (responsavel pela reserva): </label>
            <input type="text" name="nome" id="nome" required
            class="form"> <br>

            <label for="email">Email: </label>
            <input type="email" name="email" id="email" class="form"> <br>

            <label for="telefone">Telefone: </label>
            <input class="form"
                type="tel" 
                name="telefone" 
                id="telefone" 
                required inputmode="numeric" 
                pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
                maxlength="15"
                title="Digite com DD. Ex: (17) 98765-4321 ou 17987654321"> <br>

            <label for="data" class="form2">Data: </label>
            <input type="date" name="data" id="data" class="form3"> <br>

            <label for="horadas" class="form2">Horário (das): </label>
            <input type="time" name="horadas" id="horadas" required class="form3"> <br>

            <label for="horaate" class="form2">Até: </label>
            <input type="time" name="horaate" id="horaate" required class="form3"> <br>

            <label for="especialidades" class="form2">Especialidade:</label>
            <select name="especialidades" id="especialidades" class="form3">
                <option value="">Selecione uma opção</option>
                <option value="futsal">Futsal</option>
                <option value="volei">Vôlei</option>
                <option value="futevôlei">Fute Vôlei</option>
                <option value="basquete">Basquete</option>
                <option value="tenisdemesa">Tenis de mesa</option>
            </select>
            <br>
            <label for="participantes" class="form2">Número de participantes: </label>
            <input type="text" name="participantes" id="participantes" title="Máximo de participantes por reserva: 25" required class="form2">
            <br>
            <button type="submit" class="botton">Confirmar Agendamento</button>
        </form>
    </main>
</body>

</html>
